<!DOCTYPE html>

  <style>

<body>

  <div class="app-container">
    <div class="header-section">
      <h1>💧 Water Challenge</h1>
      <p>Reto de hidratación grupal • 30 días</p>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-users" onclick="switchTab('users')">👥 Participantes</button>
      <button class="tab-btn" id="tab-ranking" onclick="switchTab('ranking')">🏅 Ranking</button>
    </div>

    <div id="main-content">
      <p style="text-align:center; color:#64748b; font-size:14px; padding:20px;">Cargando reto...</p>
    </div>
  </div>

  <div id="modal-container"></div>
  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyACJIVPrpqnc7NcnzDPTLhJmQwl2ST6bFA",
      authDomain: "water-challenge-e1ed6.firebaseapp.com",
      databaseURL: "https://water-challenge-e1ed6-default-rtdb.firebaseio.com",
      projectId: "water-challenge-e1ed6",
      storageBucket: "water-challenge-e1ed6.firebasestorage.app",
      messagingSenderId: "478404528810",
      appId: "1:478404528810:web:b76861d417e5efc3809ed3",
      measurementId: "G-JSJZ7J16R1"
    };
    
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    // La sesión dura solo mientras la pestaña está abierta (coincide con el comportamiento
    // actual de sessionStorage: en un dispositivo compartido, cada quien "entra" con su PIN).
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    let START = new Date('2026-05-27'); START.setHours(0,0,0,0); 
    let myId = sessionStorage.getItem('wc_myid') || null;
    let viewingId = null; 
    let currentTab = 'users'; 
    let allUsers = {};

    const MONTHS = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

    // Antes de poder mostrar la lista de participantes hace falta estar "autenticado"
    // (así lo exigen las reglas). Si nadie ha iniciado sesión con su PIN todavía,
    // usamos una sesión anónima automática solo para poder leer la lista.
    function ensureAuthReady() {
      return new Promise((resolve) => {
        const unsub = auth.onAuthStateChanged((user) => {
          unsub();
          if (user) return resolve(user);
          auth.signInAnonymously()
            .then(cred => resolve(cred.user))
            .catch(err => { console.error('No se pudo iniciar sesión anónima:', err); resolve(null); });
        });
      });
    }

    window.onload = async function() {
      await ensureAuthReady();
      initReminders();

      db.ref('users').on('value', (snapshot) => {
        allUsers = snapshot.val() || {};
        render();
      });

      db.ref('config/startDate').on('value', (snapshot) => {
        if(snapshot.val()) {
          START = new Date(snapshot.val() + 'T00:00:00');
          render();
        }
      });
    };

    // --- Seguridad: el PIN nunca se guarda en la base de datos. ---
    // Se usa como contraseña de una cuenta de Firebase Auth "sintética" (email inventado,
    // nunca se envía correo real). Firebase guarda la contraseña hasheada internamente.
    function pinToEmail(id) {
      return `${id}@water-challenge.local`;
    }
    function pinToPassword(pin) {
      // Firebase exige contraseñas de mínimo 6 caracteres; el PIN visible sigue siendo de 4.
      return `wc_${pin}_secure`;
    }

    // Escapa cualquier texto antes de insertarlo en innerHTML (evita XSS vía nombre de usuario)
    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Justo después de crear/iniciar sesión, la conexión de la Realtime Database
    // puede tardar una fracción de segundo en "reautenticarse" con el nuevo usuario.
    // Este helper reintenta la escritura un par de veces si eso pasa.
    async function writeWithRetry(ref, value, isUpdate = false, retries = 4, delayMs = 350) {
      for (let i = 0; i < retries; i++) {
        try {
          await (isUpdate ? ref.update(value) : ref.set(value));
          return;
        } catch (e) {
          if (i === retries - 1) throw e;
          await new Promise(r => setTimeout(r, delayMs));
        }
      }
    }

    async function registerUser(id, name, goal, pin) {
      let cred;
      try {
        cred = await auth.createUserWithEmailAndPassword(pinToEmail(id), pinToPassword(pin));
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          // Probablemente quedó una cuenta huérfana de un intento anterior que falló al guardar
          // el perfil. Si el PIN coincide, la reutilizamos en vez de fallar.
          cred = await auth.signInWithEmailAndPassword(pinToEmail(id), pinToPassword(pin));
        } else {
          throw e;
        }
      }
      await writeWithRetry(db.ref('users/' + id), { name, goal, days: {}, authUid: cred.user.uid });
    }

    async function updateUserPin(newPin) {
      const user = auth.currentUser;
      if (!user) return showToast("Debes volver a ingresar para cambiar el PIN.");
      try {
        await user.updatePassword(pinToPassword(newPin));
        showToast("🔒 ¡PIN personalizado guardado con éxito!");
      } catch (e) {
        if (e.code === 'auth/requires-recent-login') {
          showToast("Por seguridad, sal y vuelve a entrar antes de cambiar el PIN.");
        } else {
          showToast("No se pudo actualizar el PIN.");
        }
      }
    }

    // --- Racha (estilo Duolingo) ---
    // Cuenta días consecutivos cumpliendo la meta, desde el inicio del reto hasta hoy.
    // El día de hoy no rompe la racha si todavía no se ha registrado (el día no ha terminado),
    // pero si se registra por debajo de la meta, sí la rompe.
    function calculateStreaks(days, goal) {
      const todayLocal = new Date(); todayLocal.setHours(0, 0, 0, 0);
      const todayStr = getLocalDateString(todayLocal);
      let cursor = new Date(START.getTime()); cursor.setHours(0, 0, 0, 0);
      let running = 0;
      let best = 0;

      while (cursor <= todayLocal) {
        const dStr = getLocalDateString(cursor);
        const val = days[dStr];
        if (val !== undefined && val >= goal) {
          running++;
          if (running > best) best = running;
        } else if (dStr === todayStr && val === undefined) {
          // Hoy todavía sin registrar: no cuenta, pero tampoco rompe la racha.
        } else {
          running = 0;
        }
        cursor.setDate(cursor.getDate() + 1);
      }
      return { current: running, best };
    }

    function streakEmoji(n) {
      if (n <= 0) return '🥶';
      if (n < 3) return '💧';
      if (n < 7) return '🔥';
      if (n < 14) return '🔥🔥';
      if (n < 30) return '🔥🔥🔥';
      return '🏆';
    }

    // --- Recordatorios (notificaciones del navegador) ---
    function notificationsSupported() {
      return 'Notification' in window;
    }
    function notificationsEnabled() {
      return notificationsSupported() && Notification.permission === 'granted' && localStorage.getItem('wc_notifications_enabled') === '1';
    }

    async function enableReminders() {
      if (!notificationsSupported()) return showToast("Tu navegador no soporta notificaciones.");
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        localStorage.setItem('wc_notifications_enabled', '1');
        showToast("🔔 ¡Recordatorios activados!");
        scheduleReminderChecks();
        render();
      } else {
        showToast("No se activaron los recordatorios.");
      }
    }

    function disableReminders() {
      localStorage.removeItem('wc_notifications_enabled');
      showToast("🔕 Recordatorios desactivados.");
      render();
    }

    let reminderIntervalStarted = false;
    function scheduleReminderChecks() {
      if (reminderIntervalStarted) return;
      reminderIntervalStarted = true;
      checkAndNotify();
      setInterval(checkAndNotify, 60 * 60 * 1000); // revisa cada hora
    }

    function checkAndNotify() {
      if (!notificationsEnabled() || !myId || !allUsers[myId]) return;
      const now = new Date();
      const hour = now.getHours();
      if (hour < 12 || hour > 21) return; // solo entre 12pm y 9pm, para no molestar de madrugada
      const todayStr = getLocalDateString(now);
      const lastNotifyKey = 'wc_last_notify_' + myId;
      if (localStorage.getItem(lastNotifyKey) === todayStr) return; // ya se avisó hoy

      const days = allUsers[myId].days || {};
      if (days[todayStr] !== undefined) return; // ya registró hoy

      try {
        new Notification('💧 Water Challenge', {
          body: '¡No olvides registrar tu consumo de agua de hoy!'
        });
        localStorage.setItem(lastNotifyKey, todayStr);
      } catch (e) { console.error('No se pudo mostrar la notificación:', e); }
    }

    function initReminders() {
      if (notificationsEnabled()) scheduleReminderChecks();
    }

    async function saveIntake(userId, dateStr, amount) {
      await db.ref(`users/${userId}/days/${dateStr}`).set(amount);
    }

    async function saveConfig(configObj) {
      await db.ref('config').update(configObj);
    }

    function loginAsUser(id) {
      const u = allUsers[id];
      if (!u) return;

      // Perfiles antiguos (de antes de este cambio) todavía traen "pin" en texto plano.
      // Los migramos a Firebase Auth automáticamente la primera vez que vuelvan a entrar.
      const isLegacyProfile = !!u.pin;
      const isTemporal = isLegacyProfile && u.pin === "0000";

      openPinModal(isTemporal, async (inputPin) => {
        try {
          if (isLegacyProfile) {
            if (inputPin !== u.pin) { showToast("❌ PIN incorrecto. Intenta de nuevo."); return; }
            let cred;
            try {
              cred = await auth.signInWithEmailAndPassword(pinToEmail(id), pinToPassword(inputPin));
            } catch (signInErr) {
              if (signInErr.code === 'auth/user-not-found') {
                cred = await auth.createUserWithEmailAndPassword(pinToEmail(id), pinToPassword(inputPin));
              } else {
                throw signInErr;
              }
            }
            await writeWithRetry(db.ref(`users/${id}`), { authUid: cred.user.uid, pin: null }, true);
            executeLogin(id);
            closeModal();
            showToast("🔒 Tu cuenta fue actualizada a un acceso más seguro.");
          } else {
            await auth.signInWithEmailAndPassword(pinToEmail(id), pinToPassword(inputPin));
            executeLogin(id);
            closeModal();
          }
        } catch (e) {
          console.error('Error de login:', e);
          const wrongPinCodes = ['auth/wrong-password', 'auth/invalid-credential', 'auth/user-not-found'];
          if (wrongPinCodes.includes(e.code)) {
            showToast("❌ PIN incorrecto. Intenta de nuevo.");
          } else {
            showToast("⚠️ Error técnico (" + (e.code || 'desconocido') + "). Revisa la consola.");
          }
        }
      });
    }

    function executeLogin(id) {
      myId = id;
      sessionStorage.setItem('wc_myid', id);
      viewingId = id;
      initReminders();
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      viewingId = null;
      document.getElementById('tab-users').classList.toggle('active', tab === 'users');
      document.getElementById('tab-ranking').classList.toggle('active', tab === 'ranking');
      render();
    }

    async function handleRegister(event) {
      if (event) event.preventDefault();
      const name = document.getElementById('reg-name').value.trim().toLowerCase();
      const goal = parseInt(document.getElementById('reg-goal').value, 10);
      const pin = document.getElementById('reg-pin').value.trim();
      
      if(!name) return showToast("Escribe un nombre");
      if(pin.length !== 4 || isNaN(pin)) return showToast("PIN debe ser de 4 números");
      
      const id = name.replace(/\s+/g, '_');
      if (allUsers[id]) return showToast("Este nombre ya existe.");

      try {
        await registerUser(id, name, goal, pin);
        myId = id;
        sessionStorage.setItem('wc_myid', id);
        viewingId = id;
        render();
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          showToast("Ese nombre ya fue usado antes. Prueba con otro.");
        } else {
          showToast("No se pudo registrar. Intenta de nuevo.");
        }
      }
    }

    function handleUpdatePin(event) {
      if (event) event.preventDefault();
      const newPin = document.getElementById('new-custom-pin').value.trim();
      if(newPin.length !== 4 || isNaN(newPin)) return showToast("El PIN debe ser de 4 números");
      updateUserPin(newPin);
    }

    async function handleLogIntake(event) {
      if (event) event.preventDefault();
      const amount = parseInt(document.getElementById('intake-amount').value, 10);
      const todayStr = getLocalDateString(new Date());
      await saveIntake(myId, todayStr, amount);

      const me = allUsers[myId];
      const goal = me ? me.goal : 0;
      if (amount >= goal) {
        const projectedDays = { ...(me && me.days ? me.days : {}), [todayStr]: amount };
        const streaks = calculateStreaks(projectedDays, goal);
        showToast(`${streakEmoji(streaks.current)} ¡Meta cumplida! Racha: ${streaks.current} ${streaks.current === 1 ? 'día' : 'días'}`);
      } else {
        showToast("🥤 Consumo guardado");
      }
    }

    async function logout() {
      await auth.signOut();
      sessionStorage.removeItem('wc_myid');
      myId = null;
      viewingId = null;
      currentTab = 'users';
      await ensureAuthReady();
      render();
    }

    async function applyNewStartDate(dateStr) {
      try {
        await saveConfig({ startDate: dateStr });
        START = new Date(dateStr + 'T00:00:00');
        showToast('Fecha actualizada');
        setTimeout(() => { location.reload(); }, 400);
      } catch(e) { console.error(e); }
    }

    function render() {
      const wrap = document.getElementById('main-content');
      if (!wrap) return;
      wrap.innerHTML = '';

      if (myId && allUsers[myId]) {
        const me = allUsers[myId];
        const displayGoal = me.goal >= 1000 ? (me.goal / 1000) + 'L' : me.goal + ' ml';
        const diffTime = new Date().setHours(0,0,0,0) - START.getTime();
        const calcDay = Math.max(1, Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1);
        
        const meStreaks = calculateStreaks(me.days || {}, me.goal);
        const banner = document.createElement('div');
        banner.className = 'profile-banner';
        banner.innerHTML = `
          <div class="profile-banner-left">
            <div class="avatar">${escapeHtml(me.name[0])}</div>
            <div class="user-details">
              <h4>${escapeHtml(me.name)} <span class="streak-badge">${streakEmoji(meStreaks.current)} ${meStreaks.current}</span></h4>
              <p>Meta: ${displayGoal} • Día ${calcDay <= 30 ? calcDay : 30} de 30</p>
            </div>
          </div>
          <button class="btn-logout" onclick="logout()">🚪 Salir</button>
        `;
        wrap.appendChild(banner);
      }

      if (currentTab === 'ranking') {
        renderRanking(wrap);
        return;
      }

      if (viewingId && allUsers[viewingId]) {
        renderDashboard(wrap, viewingId);
      } else {
        renderUsersList(wrap);
      }
    }

    function renderUsersList(wrap) {
      if (!myId) {
        const box = document.createElement('div');
        box.className = 'auth-box';
        box.innerHTML = `
          <h3>¡Únete al Reto!</h3>
          <form id="reg-form">
            <div class="form-group"><label>Nombre / Apodo:</label><input type="text" id="reg-name" class="form-control" required /></div>
            <div class="form-group">
              <label>Meta diaria:</label>
              <select id="reg-goal"><option value="2000" selected>2 litros (Recomendado)</option><option value="2500">2.5 litros</option><option value="3000">3 litros</option></select>
            </div>
            <div class="form-group"><label>Crea un PIN de Seguridad (4 números):</label><input type="password" id="reg-pin" class="form-control" maxlength="4" pattern="[0-9]*" inputmode="numeric" required /></div>
            <button type="submit" class="btn-primary">Registrarme</button>
          </form>
        `;
        wrap.appendChild(box);
        document.getElementById('reg-form').addEventListener('submit', handleRegister);
      }

      const listContainer = document.createElement('div');
      listContainer.className = 'user-list';
      
      Object.keys(allUsers).forEach(k => {
        const u = allUsers[k];
        const metDays = Object.values(u.days || {}).filter(v => v >= u.goal).length;
        const streaks = calculateStreaks(u.days || {}, u.goal);
        const card = document.createElement('div');
        card.className = 'user-card';
        card.onclick = () => loginAsUser(k);
        const safeName = escapeHtml(u.name);
        const isSecured = !!u.authUid;
        card.innerHTML = `
          <div class="user-info">
            <div class="avatar">${escapeHtml(u.name[0])}</div>
            <div class="user-details">
              <h4>${safeName} ${isSecured ? '🔒' : '⚠️ Requiere actualización'} <span class="streak-badge">${streakEmoji(streaks.current)} ${streaks.current}</span></h4>
              <p>Días cumplidos: ${metDays} de 30</p>
            </div>
          </div>
          <span>➔</span>
        `;
        listContainer.appendChild(card);
      });
      wrap.appendChild(listContainer);
    }

    function renderDashboard(wrap, userId) {
      const u = allUsers[userId];
      const days = u.days || {};
      const goal = u.goal;

      const daysArray = Object.values(days);
      const daysMet = daysArray.filter(v => v >= goal).length;
      const progressPercent = Math.min(100, Math.round((daysMet / 30) * 100));
      const streaks = calculateStreaks(days, goal);

      const viewHeader = document.createElement('div');
      viewHeader.className = 'viewing-header';
      viewHeader.innerHTML = `
        <div class="viewing-header-left"><button class="btn-back" onclick="switchTab('users')">← Volver</button></div>
      `;
      wrap.appendChild(viewHeader);

      if (userId === myId) {
        const todayStr0 = getLocalDateString(new Date());
        const hasLoggedToday = days[todayStr0] !== undefined;
        if (!hasLoggedToday && !notificationsEnabled() && notificationsSupported()) {
          const reminderBanner = document.createElement('div');
          reminderBanner.className = 'reminder-banner';
          reminderBanner.innerHTML = `🔔 Actívate un recordatorio diario para no perder tu racha ${streakEmoji(streaks.current)} — <a href="#" onclick="enableReminders(); return false;" style="color:#9a3412; text-decoration:underline;">Activar</a>`;
          wrap.appendChild(reminderBanner);
        }
      }

      const indGrid = document.createElement('div');
      indGrid.className = 'indicators-grid';
      indGrid.innerHTML = `
        <div class="ind-card"><div class="ind-val">${daysMet}</div><div class="ind-lbl">Cumplidos</div></div>
        <div class="ind-card"><div class="ind-val">${progressPercent}%</div><div class="ind-lbl">Progreso</div></div>
        <div class="ind-card streak-card"><div class="ind-val">${streakEmoji(streaks.current)} ${streaks.current}</div><div class="ind-lbl">Racha${streaks.best > streaks.current ? ' (mejor: ' + streaks.best + ')' : ''}</div></div>
      `;
      wrap.appendChild(indGrid);

      if (userId === myId) {
        const todayStr = getLocalDateString(new Date());
        const currentSavedIntake = days[todayStr] !== undefined ? days[todayStr] : -1;
        const intakeBox = document.createElement('div');
        intakeBox.className = 'intake-box';
        intakeBox.innerHTML = `
          <div class="intake-title">💧 Registrar agua de hoy</div>
          <form id="intake-form" class="intake-row">
            <select id="intake-amount" style="flex:1;">
              <option value="0" ${currentSavedIntake===0?'selected':''}>0 ml</option>
              <option value="1000" ${currentSavedIntake===1000?'selected':''}>1.0 L</option>
              <option value="2000" ${currentSavedIntake===2000?'selected':''}>2.0 L</option>
              <option value="2500" ${currentSavedIntake===2500?'selected':''}>2.5 L</option>
              <option value="3000" ${currentSavedIntake===3000?'selected' :''}>3.0 L</option>
            </select>
            <button type="submit" class="btn-save-intake">Guardar</button>
          </form>
        `;
        wrap.appendChild(intakeBox);
        document.getElementById('intake-form').addEventListener('submit', handleLogIntake);
      }

      const calSection = document.createElement('div');
      calSection.className = 'calendar-section';
      const grid = document.createElement('div');
      grid.className = 'grid-30';

      const todayLocalDateStr = getLocalDateString(new Date());

      for (let i = 0; i < 30; i++) {
        let targetDate = new Date(START.getTime()); targetDate.setDate(targetDate.getDate() + i);
        const dateStr = getLocalDateString(targetDate);
        const cellDateText = `${targetDate.getDate()} / ${MONTHS[targetDate.getMonth()]}`;

        const valLog = days[dateStr];
        let statusClass = '';
        let displayVolume = '';

        if (valLog !== undefined) {
          displayVolume = valLog >= 1000 ? (valLog/1000)+'L' : valLog+'ml';
          if (valLog >= goal) statusClass = 'status-done';
          else if (valLog > 0) statusClass = 'status-under';
        }

        const cell = document.createElement('div');
        cell.className = `day-cell ${statusClass} ${dateStr === todayLocalDateStr ? 'active-day' : ''}`;
        cell.innerHTML = `<div class="day-num-text">${cellDateText}</div><div class="day-val">${displayVolume}</div>`;
        grid.appendChild(cell);
      }
      calSection.appendChild(grid);
      wrap.appendChild(calSection);

      if (userId === myId) {
        const settings = document.createElement('div');
        settings.className = 'settings-section';
        settings.innerHTML = `
          <h3>🔔 Recordatorios diarios</h3>
          <div class="setting-row" style="margin-bottom:20px;">
            <p style="font-size:12px; color:#64748b; margin:0; flex:1;">
              ${notificationsSupported() ? (notificationsEnabled() ? 'Activados: te avisamos si no has registrado tu agua.' : 'Recibe un aviso en el navegador si se te olvida registrar.') : 'Tu navegador no soporta notificaciones.'}
            </p>
            ${notificationsSupported() ? (notificationsEnabled()
              ? `<button class="btn-secondary" onclick="disableReminders()">Desactivar</button>`
              : `<button class="btn-secondary" onclick="enableReminders()">Activar</button>`) : ''}
          </div>

          <h3>🔑 Seguridad: Personalizar mi PIN</h3>
          <form id="pin-update-form" class="setting-row" style="margin-bottom:20px;">
            <input type="password" id="new-custom-pin" class="form-control" style="max-width:180px;" placeholder="Nuevo PIN (4 números)" maxlength="4" required />
            <button type="submit" class="btn-secondary">Actualizar PIN</button>
          </form>

          <h3>📅 Configuración Fecha de Inicio</h3>
          <div class="setting-row">
            <input type="date" id="new-start-date" class="form-control" value="${START.toISOString().split('T')[0]}" />
            <button class="btn-secondary" onclick="triggerApplyDate()">Aplicar</button>
          </div>
        `;
        wrap.appendChild(settings);
        document.getElementById('pin-update-form').addEventListener('submit', handleUpdatePin);
      }
    }

    function renderRanking(wrap) {
      const rankContainer = document.createElement('div');
      rankContainer.className = 'ranking-list';

      const arr = Object.keys(allUsers).map(k => {
        const u = allUsers[k];
        const totalMl = Object.values(u.days || {}).reduce((acc, vol) => acc + (parseInt(vol, 10) || 0), 0);
        const metDaysCount = Object.values(u.days || {}).filter(v => v >= u.goal).length;
        return { name: u.name, litros: totalMl / 1000, diasCumplidos: metDaysCount, id: k };
      });

      arr.sort((a, b) => b.litros - a.litros || b.diasCumplidos - a.diasCumplidos);

      arr.forEach((item, index) => {
        let trophy = index + 1;
        if (index === 0) trophy = '🥇';
        else if (index === 1) trophy = '🥈';
        else if (index === 2) trophy = '🥉';

        const itemEl = document.createElement('div');
        itemEl.className = 'rank-item';
        itemEl.innerHTML = `
          <div class="rank-left"><span class="rank-num">${trophy}</span><span class="rank-name">${escapeHtml(item.name)}</span></div>
          <div class="rank-stats-container"><div class="rank-score-litros">${item.litros.toFixed(1)} L</div><div class="rank-score-dias">🏆 ${item.diasCumplidos} / 30 d</div></div>
        `;
        rankContainer.appendChild(itemEl);
      });
      wrap.appendChild(rankContainer);
    }

    function openPinModal(isTemporal, onPinSubmit) {
      const modalWrap = document.getElementById('modal-container');
      const msgText = isTemporal 
        ? "⚠️ Tu perfil es antiguo. Introduce el PIN temporal <b>0000</b> para ingresar y cámbialo en la parte de abajo:" 
        : "Introduce tu PIN de 4 números para acceder a tu calendario:";

      modalWrap.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <h4>🔒 Perfil Protegido</h4>
            <p style="font-size:13px; color:#64748b; margin-bottom:12px;">${msgText}</p>
            <div style="margin-bottom:16px;"><input type="password" id="input-pin-verify" class="form-control" style="text-align:center; font-size:20px; letter-spacing:6px;" maxlength="4" inputmode="numeric" placeholder="••••" /></div>
            <div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal()">Cancelar</button><button class="modal-btn confirm" id="btn-pin-submit">Ingresar</button></div>
          </div>
        </div>
      `;
      document.getElementById('btn-pin-submit').onclick = () => {
        onPinSubmit(document.getElementById('input-pin-verify').value.trim());
      };
    }

    function openModal(title, msg, onConfirmClick) {
      const modalWrap = document.getElementById('modal-container');
      modalWrap.innerHTML = `
        <div class="modal-overlay"><div class="modal-box"><h4>${title}</h4><p>${msg}</p><div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal()">Cancelar</button><button class="modal-btn confirm" id="modal-confirm-btn">Confirmar</button></div></div></div>
      `;
      document.getElementById('modal-confirm-btn').onclick = onConfirmClick;
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
    function triggerApplyDate() {
      const inputVal = document.getElementById('new-start-date').value;
      if(!inputVal) return showToast("Fecha inválida");
      openModal("¿Cambiar inicio?", `Moverás el inicio global a ${inputVal}`, () => applyNewStartDate(inputVal));
    }

    // Utilidades
    function getLocalDateString(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }
  </script>
</body>
</html>
